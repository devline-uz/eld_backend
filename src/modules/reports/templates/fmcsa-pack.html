<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: #1a1a1a; }
  h1 { font-size: 18px; margin-bottom: 0; }
  .meta { color: #555; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
  th { background: #f2f2f2; }
  .INCLUDED { color: #0a7a2f; font-weight: bold; }
  .SKIPPED { color: #b30000; font-weight: bold; }
</style>
</head>
<body>
  <h1>FMCSA Compliance Package</h1>
  <div class="meta">
    Carrier: {{carrier.name}} (DOT {{carrier.dot}})<br/>
    Period: {{period.from}} — {{period.to}}<br/>
    Generated: {{generatedAt}}
  </div>
  <table>
    <thead>
      <tr><th>Driver</th><th>Status</th><th>Output file</th><th>Uncertified days</th><th>Reason</th></tr>
    </thead>
    <tbody>
      {{#each drivers}}
      <tr>
        <td>{{driverName}}</td>
        <td class="{{status}}">{{status}}</td>
        <td>{{fileName}}</td>
        <td>{{uncertifiedDays}}</td>
        <td>{{reason}}</td>
      </tr>
      {{/each}}
    </tbody>
  </table>
</body>
</html>
