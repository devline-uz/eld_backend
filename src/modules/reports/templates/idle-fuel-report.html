<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: #1a1a1a; }
  h1 { font-size: 18px; margin-bottom: 0; }
  .meta { color: #555; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
  th { background: #f2f2f2; }
</style>
</head>
<body>
  <h1>Idle Time &amp; Fuel Waste Report</h1>
  <div class="meta">
    Period: {{from}} — {{to}}<br/>
    Total idle hours: {{totalIdleHours}} &nbsp;|&nbsp; Total idle fuel: {{totalFuelIdleGal}} gal
  </div>
  <table>
    <thead>
      <tr><th>Unit</th><th>Driver</th><th>Date</th><th>Idle hours</th><th>Idle fuel (gal)</th></tr>
    </thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td>{{unitNumber}}</td>
        <td>{{driverName}}</td>
        <td>{{date}}</td>
        <td>{{idleHours}}</td>
        <td>{{fuelIdleGal}}</td>
      </tr>
      {{/each}}
    </tbody>
  </table>
</body>
</html>
